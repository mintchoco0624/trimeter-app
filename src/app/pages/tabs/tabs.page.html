<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="meter">
      <ion-icon name="speedometer" aria-hidden="true"></ion-icon>
      <ion-label>Meter</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="history" data-testid="tab-history">
      <ion-icon name="receipt" aria-hidden="true"></ion-icon>
      <ion-label>{{ historyLabel() }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="fare-info">
      <ion-icon name="information-circle" aria-hidden="true"></ion-icon>
      <ion-label>Fare Info</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="account" data-testid="tab-account">
      <ion-icon name="person-circle" aria-hidden="true"></ion-icon>
      <ion-label>Account</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
